title = "tran-real-estate gitleaks config"

[extend]
useDefault = true

# Two synthetic Web3Forms-shaped fixture keys landed in 4e453c1 (packages/core agent schema
# tests) and 05793bf (Phase 8 deferred-items.md) before being swapped for all-zero placeholders.
# Web3Forms keys are public-safe by design and neither value belonged to any account.
# Re-derived 2026-10-29 after the message-only history rewrite (LIVE-01): without this table
# gitleaks 8.30.1 reports exactly these 2 generic-api-key findings; both commits predate the
# first rewritten commit, so their SHAs did not change. commits and paths each clear both.
[allowlist]
commits = ["4e453c1bbceefe392ad720eaa049bbd1dae8cc43", "05793bfa1b15bc5d55d0650cea17e8f17707a27e"]
paths = [
  '''packages/core/src/agent/schemas\.test\.ts''',
  '''\.planning/phases/08-agent-portal-profile-lead-intake-crm/deferred-items\.md'''
]

[[rules]]
id = "tran-canary-test-key"
description = "Canary pattern proving the scanner blocks commits (never a real credential)"
regex = '''TRANCANARY_[A-Z0-9]{32}'''
keywords = ["trancanary_"]
