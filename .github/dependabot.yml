version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Phase 16 released the SvelteKit, adapter-static and Vitest-family majors after they landed; the majors still held
    # back are pnpm and @types/node. The weekly minor/patch group stays. Security updates are reviewed by the pnpm audit gate.
    ignore:
      - dependency-name: 'pnpm'
        update-types: ['version-update:semver-major']
      # @types/node majors: owner decision B (Phase 13), re-evaluated in Phase 14/16.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
