name: extension-release

# Dormant until the owner creates the remote and sets the repository variable named in the
# release job's if: line to true. Pushing an ext-v<version> tag then builds, tests and
# oracle-checks the extension and publishes the zip + SHA256SUMS.txt as a GitHub Release.
on:
  push:
    tags: ['ext-v*']

permissions:
  contents: read

concurrency:
  group: extension-release
  cancel-in-progress: false

jobs:
  release:
    name: build, verify and publish the extension zip
    if: vars.EXTENSION_RELEASES_ENABLED == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # No cache on a release job: a cache written by another ref could poison the published zip.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - name: Tag matches the extension package version
        run: test "$GITHUB_REF_NAME" = "ext-v$(node -p "require('./apps/extension/package.json').version")"
      - run: pnpm vitest run --project extension
      # The zip and its oracle read the same site URL (PUBLIC_SITE_URL + BASE_PATH through
      # resolveSiteUrl: the popup's PRIVACY_URL and the oracle's URL allowlist). Unset values expand
      # to '', which site-config / base-path treat as the defaults.
      - name: Zip the extension
        run: pnpm --filter extension zip
        env:
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
          BASE_PATH: ${{ vars.BASE_PATH }}
      - name: Manifest and zero-network oracle
        run: node scripts/assert-extension.mjs apps/extension/.output/chrome-mv3 --zip-dir apps/extension/.output
        env:
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
          BASE_PATH: ${{ vars.BASE_PATH }}
      - name: Checksums
        working-directory: apps/extension/.output
        run: sha256sum sponsored-listing-filter-*.zip > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "Sponsored Listing Filter $GITHUB_REF_NAME" --notes-file docs/EXTENSION-INSTALL.md apps/extension/.output/sponsored-listing-filter-*.zip apps/extension/.output/SHA256SUMS.txt
