name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  hygiene:
    name: secrets + real-data guard
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Commit messages carry no assistant attribution
        run: node scripts/commit-hygiene.mjs --history
      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Canary self-test (config must reject the test pattern)
        run: node scripts/gitleaks-canary.mjs
      - name: Scan full git history
        run: gitleaks git --no-banner --redact --config .gitleaks.toml .
      - name: Real-data / CoStar guard
        run: node scripts/guard-real-data.mjs --all
      - name: Banned marketing/legal terms
        run: node scripts/banned-terms.mjs
      - name: shadcn class guard
        run: node scripts/ui-class-guard.mjs

  quality:
    name: check, lint, unit, build, csp, e2e+axe (${{ matrix.target }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: root
            build_dir: build
          - target: sub
            build_dir: build-sub
          - target: configured
            build_dir: build-configured
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # pnpm test:unit runs scripts/precommit.test.ts, which is fail-closed and needs gitleaks on PATH.
      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      # Full dependency audit (prod + dev, low and up). The lockfile is shared, so one leg is enough.
      - if: matrix.target == 'root'
        run: pnpm audit:deps
      # Before pnpm test:unit: the web-browser Vitest project runs component tests in Chromium.
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm check
      - run: pnpm lint
      - run: node scripts/gen-fixtures.mjs --check
      - run: pnpm test:unit
      # Deploy what you test: the owner's repository variables reach ONLY the root leg (the deploy
      # build). An unset variable expands to '', which site-config treats as unset. BASE_PATH and
      # BUILD_DIR come from scripts/lib/build-targets.mjs; the configured target overrides every
      # owner setting with test values there.
      - name: Build
        run: pnpm run build:${{ matrix.target }}
        env:
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
          PUBLIC_ANALYTICS_HOST: ${{ matrix.target == 'root' && vars.PUBLIC_ANALYTICS_HOST || '' }}
          PUBLIC_ANALYTICS_WEBSITE_ID: ${{ matrix.target == 'root' && vars.PUBLIC_ANALYTICS_WEBSITE_ID || '' }}
          PUBLIC_WEB3FORMS_KEY: ${{ matrix.target == 'root' && vars.PUBLIC_WEB3FORMS_KEY || '' }}
          PUBLIC_CONTACT_EMAIL: ${{ matrix.target == 'root' && vars.PUBLIC_CONTACT_EMAIL || '' }}
      - name: CSP oracle
        run: node scripts/assert-csp.mjs apps/web/${{ matrix.build_dir }} --target ${{ matrix.target }}
        env:
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
          PUBLIC_ANALYTICS_HOST: ${{ matrix.target == 'root' && vars.PUBLIC_ANALYTICS_HOST || '' }}
          PUBLIC_ANALYTICS_WEBSITE_ID: ${{ matrix.target == 'root' && vars.PUBLIC_ANALYTICS_WEBSITE_ID || '' }}
          PUBLIC_WEB3FORMS_KEY: ${{ matrix.target == 'root' && vars.PUBLIC_WEB3FORMS_KEY || '' }}
          PUBLIC_CONTACT_EMAIL: ${{ matrix.target == 'root' && vars.PUBLIC_CONTACT_EMAIL || '' }}
      - name: SEO oracle
        run: node scripts/assert-seo.mjs apps/web/${{ matrix.build_dir }} --target ${{ matrix.target }}
        env:
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
          PUBLIC_ANALYTICS_HOST: ${{ matrix.target == 'root' && vars.PUBLIC_ANALYTICS_HOST || '' }}
          PUBLIC_ANALYTICS_WEBSITE_ID: ${{ matrix.target == 'root' && vars.PUBLIC_ANALYTICS_WEBSITE_ID || '' }}
          PUBLIC_WEB3FORMS_KEY: ${{ matrix.target == 'root' && vars.PUBLIC_WEB3FORMS_KEY || '' }}
          PUBLIC_CONTACT_EMAIL: ${{ matrix.target == 'root' && vars.PUBLIC_CONTACT_EMAIL || '' }}
      # Initial-JS budget on the deploy build AND on the analytics-on build: production ships with
      # analytics configured, so the configured build is what visitors load.
      - name: JS budget (deploy build)
        if: matrix.target == 'root'
        run: node scripts/assert-budget.mjs apps/web/build --require-tools
      - name: JS budget (analytics-on build)
        if: matrix.target == 'configured'
        run: node scripts/assert-budget.mjs apps/web/build-configured --require-tools
      - name: E2E + axe
        run: pnpm --filter web exec playwright test --project=${{ matrix.target }}
        env:
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
          PUBLIC_ANALYTICS_HOST: ${{ matrix.target == 'root' && vars.PUBLIC_ANALYTICS_HOST || '' }}
          PUBLIC_ANALYTICS_WEBSITE_ID: ${{ matrix.target == 'root' && vars.PUBLIC_ANALYTICS_WEBSITE_ID || '' }}
          PUBLIC_WEB3FORMS_KEY: ${{ matrix.target == 'root' && vars.PUBLIC_WEB3FORMS_KEY || '' }}
          PUBLIC_CONTACT_EMAIL: ${{ matrix.target == 'root' && vars.PUBLIC_CONTACT_EMAIL || '' }}
      # The extension is target-independent (no BASE_PATH, no owner variables), so it runs once on
      # the root leg. Chromium is already installed above; the E2E runs new-headless Chromium.
      - name: Extension build + manifest/zero-network oracle
        if: matrix.target == 'root'
        run: pnpm ext:build && pnpm ext:assert
      - name: Extension popup axe + runtime E2E
        if: matrix.target == 'root'
        run: pnpm ext:test:browser && pnpm ext:e2e
      - name: Upload Pages artifact
        if: matrix.target == 'root' && github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PAGES_ENABLED == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/web/build
          include-hidden-files: true

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PAGES_ENABLED == 'true'
    needs: [hygiene, quality]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
